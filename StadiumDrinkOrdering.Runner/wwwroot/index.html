<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HALFTIME Runner</title>
    <base href="/" />
    <!-- Behind the ngrok path proxy the Runner lives under /runner/ (Ngrok.md). Switch the base
         before any relative URL below is resolved, so CSS, _framework and the service worker load
         from /runner/ there, while direct LAN access at the root keeps working unchanged. -->
    <script>
        (function () {
            var prefix = '/runner/';
            var p = location.pathname;
            if (p === prefix.slice(0, -1) || p.indexOf(prefix) === 0) {
                document.querySelector('base').setAttribute('href', prefix);
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <!-- Bump ?v= whenever an app stylesheet changes so browsers don't serve a stale cached copy. -->
    <link rel="stylesheet" href="css/app.css?v=1" />
    <link rel="stylesheet" href="css/console-login.css?v=2" />
    <link rel="stylesheet" href="_content/StadiumDrinkOrdering.UI/css/console-auth.css" />
    <link rel="stylesheet" href="_content/StadiumDrinkOrdering.UI/css/brand.css" />
    <link rel="stylesheet" href="css/runner.css?v=8" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="StadiumDrinkOrdering.Runner.styles.css" rel="stylesheet" />
    <!-- use-credentials: manifests are fetched WITHOUT cookies by default, so behind the free ngrok tunnel
         the request would get ngrok's browser-warning HTML ("Manifest: Syntax error"). See Ngrok.md §9. -->
    <link href="manifest.webmanifest" rel="manifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        // Short haptic tick for eyes-off confirmation of claim/deliver.
        // Guarded: the Vibration API is unsupported on iOS Safari and desktop — must never throw.
        window.runnerHaptic = function (ms) {
            try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* unsupported — ignore */ }
        };
    </script>
    <script src="js/culture.js"></script>
    <script src="js/ticket-scanner.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
